[package]
name = "redox-pkg"
description = "redox package manager library"

version.workspace = true
edition.workspace = true
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pkg"
doctest = false

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["library"]

[dependencies]
dirs = { version = "7.0.0", optional = true }
hex = { version = "0.4", features = ["serde"] }
indicatif = { version = "0.18", optional = true, default-features = false }
pkgar = { path = "../pkgar", optional = true, version = "0.3.3" }
pkgar-core = { path = "../pkgar-core", optional = true, version = "0.3.3" }
serde = "1"
serde_derive = "1"
thiserror = "2"
toml = "1"

[features]
default = ["library"]
indicatif = ["dep:indicatif"]
library = ["dirs", "pkgar", "pkgar-core", "ureq"]

[dependencies.ureq]
version = "3.4"
default-features = false
features = ["rustls"]
optional = true
